# Estância Maciel — Render Blueprint (https://render.com/docs/blueprint-spec)
# No painel: New → Blueprint → escolha este repositório → Apply.
#
# Por enquanto só o ambiente de HOMOLOGAÇÃO (testes). O de PRODUÇÃO entra no go-live (Fase 10),
# para não criar um serviço pago antes da hora. O banco NÃO é do Render: é o Neon (ADR-006).
#
# No Apply, o Render pede só 3 valores (sync: false): os dois endereços do Neon e a lista de
# hosts permitidos. O administrador é criado depois, na tela de primeiro acesso do painel.
# Passo a passo: docs/infra-hml.md

envVarGroups:
  - name: estancia-hml
    envVars:
      - key: APP_ENV
        value: hml
      - key: SEED_DEMO
        value: "false"
      - key: MODULOS_OPCIONAIS
        value: ""
      - key: REGISTRO_PUBLICO
        value: "false"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_URL # origens liberadas no CORS: os sites do catálogo no Firebase
        value: "https://estancia-maciel.web.app,https://estancia-maciel.firebaseapp.com,https://estancia-maciel-hml.web.app,https://estancia-maciel-hml.firebaseapp.com"
      - key: LOJA_WHATSAPP # recebe os orçamentos do catálogo (55 + DDD + número)
        value: "5534998942864"
      - key: DATABASE_URL # Neon HML com pooler (host com -pooler), sslmode=verify-full
        sync: false
      - key: DIRECT_URL # Neon HML sem pooler: usado só pelas migrations
        sync: false
      - key: DB_HOSTS_PERMITIDOS # hosts do Neon HML; o servidor não sobe com outro banco
        sync: false

services:
  - type: web
    name: estancia-api-hml
    runtime: node
    plan: free # dorme após 15 min sem acesso; aceitável em HML (ADR-012)
    region: ohio # perto do Neon us-east-2; ajuste se o projeto Neon ficar em outra região
    branch: develop
    # Publica a cada push em develop, mas só depois que o CI do GitHub passar.
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod -w apps/api
    healthCheckPath: /api/saude
    envVars:
      - fromGroup: estancia-hml
